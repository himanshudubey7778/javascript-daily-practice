<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Art</title>

    <style>
        body {
            font-family: Arial, Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #dfdfdf;
        }

        #grid-container {
            margin: 20px;
            border: 1px solid #000;
            display: grid;
        }

        .pixel {
            width: 20px;
            height: 20px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        #color-picker {
            margin: 10px;

        }

        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            background-color: rgb(122, 53, 149);
            color: white;
            padding: 5px;
            border-radius: 10px;

        }
    </style>
</head>

<body>
    <!--1st component-->
    <h1>Pixel Art</h1>

    <!--2nd component-->
    <div>
        <input type="color" id="color-picker" value="#000000">
        <button id="clear-btn">Clear Canvas</button>
        <input type="number" id="grid-size" value="16">
        <button id="Resize-btn">Resize-grid</button>
    </div>

    <!-- 3rd component-->
    <div id="grid-container"></div>

    <script>

        const gridContainer = document.getElementById('grid-container');
        const colorPicker = document.getElementById('color-picker');
        const clearBtn = document.getElementById('clear-btn');
        const gridSizeInput = document.getElementById('grid-size');
        const resizeBtn = document.getElementById('Resize-btn');

        let gridSize = 16;
        let isDrawing = false;

        function CreationGrid(size) {
            gridContainer.innerHTML = "";
            gridContainer.style.gridTemplateColumns = `repeat(${size}, 20px)`;
            gridContainer.style.gridTemplateRows = `repeat(${size}, 20px)`;

            for (let i = 0; i < size * size; i++) {
                const pixel = document.createElement('div');
                pixel.classList.add('pixel');
                pixel.addEventListener('mousedown', startDrawing);
                pixel.addEventListener('mouseup', stopDrawing);
                pixel.addEventListener('mouseover', draw);
                gridContainer.appendChild(pixel);
            }
        }

        function startDrawing() { isDrawing = true; }
        function draw(event) {
            if (isDrawing && event.target.classList.contains('pixel')) {
                event.target.style.backgroundColor = colorPicker.value;
            }
        }
        function stopDrawing() { isDrawing = false; }

        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.pixel').forEach(pixel => pixel.style.backgroundColor = '');
        });

        resizeBtn.addEventListener('click', () => {
            gridSize = parseInt(gridSizeInput.value) || 16;
            CreationGrid(gridSize);
        });

        // Initial grid
        CreationGrid(gridSize);

    </script>

</body>

</html>
