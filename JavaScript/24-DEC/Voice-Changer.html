<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Changer 🎧</title>
    <style>
        body { background: #1e272e; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        input[type="text"] { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        
        .controls { margin: 20px; background: #485460; padding: 20px; display: inline-block; border-radius: 10px; }
        label { display: block; margin-top: 10px; }
        
        button { background: #0fb9b1; color: white; border: none; padding: 10px 30px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; border-radius: 5px; }
        button:hover { background: #20bf6b; }
    </style>
</head>
<body>
    <h1>🎤 Voice Changer</h1>
    <input type="text" id="msg" value="Hello Himanshu, I am your code!">

    <div class="controls">
        <label>🐢 Speed 🐇 (Rate)</label>
        <input type="range" id="rate" min="0.5" max="3" value="1" step="0.1">

        <label>👹 Pitch 👽 (Awaaz)</label>
        <input type="range" id="pitch" min="0" max="2" value="1" step="0.1">
    </div>

    <br>
    <button onclick="speak()">🔊 Speak</button>

    <script>
        function speak() {
            const text = document.getElementById("msg").value;
            
            // Ab dono IDs HTML mein maujood hain
            const rateVal = document.getElementById("rate").value;
            const pitchVal = document.getElementById("pitch").value;

            const speech = new SpeechSynthesisUtterance();
            speech.text = text;

            speech.rate = rateVal;
            
            // FIX: Spelling sahi ki (specch -> speech)
            speech.pitch = pitchVal;

            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
