<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <h1 id="numberDisplay">0</h1>

    <button id="btn">Increase (+)</button>
    <button id="btn1">Decrease (-)</button>

    <script>
        let heading = document.querySelector("#numberDisplay");
        let btn = document.querySelector("#btn");
        let btn1 = document.querySelector("#btn1");

        //This important
        let count = 0;

        btn.addEventListener("click", () => {
            //1. memory In value Increase
            //notes. apply 2 option - and + 
            count = count + 1; //to this short in count++ write this
            //2. Screen but update do it 
            heading.innerText = count;

            // Just for fun: Console mein check karo
            console.log("Abhi count hai:", count);
        });
         btn1.addEventListener("click", () => {
            //1. memory In value Increase
            //notes. apply 2 option - and + 
            count = count - 1; //to this short in count++ write this
            //2. Screen but update do it 
            heading.innerText = count;

            // Just for fun: Console mein check karo
            console.log("Abhi count hai:", count);
        });
            
            
    </script>
</body>
</html>
