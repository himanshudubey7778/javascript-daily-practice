<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medi-Sahayak AI</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
        .header { background-color: #007bff; color: white; width: 100%; padding: 20px 0; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .container { background: white; width: 90%; max-width: 400px; margin-top: 20px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        #preview-image { width: 100%; max-height: 250px; object-fit: contain; border: 2px dashed #cbd5e0; border-radius: 10px; margin-bottom: 20px; display: none; }
        .upload-icon { font-size: 50px; color: #cbd5e0; margin-bottom: 20px; display: block; }
        .btn-upload { background-color: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-size: 1.1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
        input[type="file"] { display: none; }
        .result-box { margin-top: 25px; text-align: left; padding: 15px; background: #e9f7ef; border-radius: 10px; border-left: 5px solid #28a745; display: none; }
        .speaker-btn { background: #007bff; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; float: right; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Medi-Sahayak 🏥</h1>
        <p>Aapki Sehat, Hamari Zimmedari</p>
    </div>

    <div class="container">
        <span class="upload-icon" id="placeholder">📷</span>
        <img id="preview-image" src="" alt="Preview">
        <input type="file" id="fileInput" accept="image/*">
        
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
            📸 Parchi Scan Karein
        </button>

        <p id="loadingText" style="display:none; color: #666; margin-top: 15px;">Dawai samajh raha hu... ⏳</p>
        
        <div class="result-box" id="resultBox"></div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Aapki nayi wali key (Jo screenshot image_7ab989.png mein hai)
        const API_KEY = "AIzaSyDd7J9mcQ315v4__UPCMena5S9m3qlEbgY"; 

        const genAI = new GoogleGenerativeAI(API_KEY);
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('preview-image');
        const placeholder = document.getElementById('placeholder');
        const loadingText = document.getElementById('loadingText');
        const resultBox = document.getElementById('resultBox');

        async function fileToGenerativePart(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Data = reader.result.split(',')[1];
                    resolve({ inlineData: { data: base64Data, mimeType: file.type } });
                };
                reader.readAsDataURL(file);
            });
        }

        fileInput.addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // UI Reset
            previewImage.src = URL.createObjectURL(file);
            previewImage.style.display = "block";
            placeholder.style.display = "none";
            loadingText.style.display = "block";
            resultBox.style.display = "none";
            loadingText.innerText = "Gemini dawa ko pehchan raha hai... 🤖";

            try {
                // MODEL FIX: Ye naam aapki list mein AVAILABLE tha
                const model = genAI.getGenerativeModel({ model: "gemini-flash-latest" });

                const imagePart = await fileToGenerativePart(file);
                const prompt = "You are a medical assistant. Analyze this medicine image. Identify the name and usage in Hinglish. Keep it short.";

                const result = await model.generateContent([prompt, imagePart]);
                const response = await result.response;
                const text = response.text();

                loadingText.style.display = "none";
                resultBox.style.display = "block";
                resultBox.innerHTML = `
                    <button class="speaker-btn" onclick="speakText()">🔊</button>
                    <h3>AI Analysis:</h3>
                    <p>${text}</p>
                `;

            } catch (error) {
                console.error(error);
                loadingText.style.display = "none";
                resultBox.style.display = "block";

                // Error Handling with clear messages
                if (error.message.includes("Failed to fetch")) {
                    resultBox.innerHTML = `<p style="color:red; font-weight:bold;">❌ Internet Error!</p><p>Laptop internet se connect nahi hai. Please WiFi check karein.</p>`;
                } else if (error.message.includes("429")) {
                    resultBox.innerHTML = `<p style="color:orange; font-weight:bold;">⏳ Quota Full!</p><p>2 Minute wait karein.</p>`;
                } else {
                    resultBox.innerHTML = `<p style="color:red; font-weight:bold;">❌ Error:</p><p>${error.message}</p>`;
                }
            }
        });

        window.speakText = function() {
            const text = document.querySelector('.result-box p').innerText;
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
