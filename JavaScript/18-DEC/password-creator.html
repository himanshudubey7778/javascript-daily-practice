<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #101010;
            color: #00ff41;
            font-family: 'Courier new', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            width: 350px;
        }

        h2 { margin-top: 0; text-transform: uppercase; letter-spacing:  2px;}

        input {
            width: 90%;
            padding: 15px;
            font-size: 20px;
            background-color: #000;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        button {
            background-color: #00ff41;
            color: black;
            border: none;
            padding: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: white;
            box-shadow: 0 0 15px #00ff41
        }

        .copy-msg {
            margin-top: 10px;
            font-size: 14px;
            color: white;
            opacity: 0;
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>
    <div class="box">
        <h2>Secure Pass</h2>

        <input type="text" id="password" placeholder="Generate Password" readonly>
        <button onclick="createPassword()">Password Create!</button>
    </div>

    <script>
        const passwordBox = document.getElementById("password");
        const msgBox = document.getElementById("msg");

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$";
        const length = 12;

        function createPassword() {
            let password = "";

            for(let i = 0; i < length; i++) {
                const randomNum = Math.floor(Math.random() * chars.length);

                password += chars[randomNum];

                passwordBox.value = password;

                console.log("new Password Generated:", password);
            }
                
            passwordBox.addEventListener("click", () => {
                if(passwordBox.value !== "") {
                    passwordBox.select();
                    document.execCommand("copy");

                    msgBox.style.opacity = "1";
                    setTimeout(() => msgBox.style.opacity = "0", 2000);
                }
            });

        }
    </script>
</body>
</html>
