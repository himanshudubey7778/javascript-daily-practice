<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple To-Do List</title>
<style>
    body {
        background-color: #f0f2f5;
        font-family: Arial, sans-sarif;
        display: flex;
        justify-content: center;
        margin-top: 50px;
    }

    .container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    input {
        padding: 10px;
        width: 60px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px;
        background-color: orangered;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    ul {
        list-style: none;
        padding: 0;
        text-align: left;
    }

    li {
        background: #eee;
        margin: 5px 0;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
    }

    li:hover {
        background-color: #ddd;
    }
</style>
</head>
<body>
    <div class="container">
        <h2>My To-Do List</h2>

        <input type="text" class="input-text" placeholder="Write a task...">
        <button onclick="addTask()">Add</button>

        <ul id=""list-container>

        </ul>
    </div>

    <script>
        function addTAsk() {
            let inputBox = document.getElementById("input-box");
            let listContainer = document.getElementById("list-container");

            if (inputBox.value === "") {
                alert("Please write something!");
            } else {
                let li = document.createElement("li");
                li.innerHTML = inputBox.value;

                listContainer.appendChild(li);

                li.onclick = function() {
                    li.remove();
                };
            }

            inputBox.value = "";
                
        }
    </script>
</body>
</html>
